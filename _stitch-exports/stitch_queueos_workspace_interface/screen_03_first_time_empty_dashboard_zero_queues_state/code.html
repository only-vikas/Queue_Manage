b-space-xs mb-space-sm"><span class="font-label-xs text-label-xs uppercase tracking-wider text-text-muted">QUEUES</span><span class="font-label-mono-xs text-label-mono-xs text-text-muted">3 ACTIVE</span></div><div class="flex flex-col space-y-space-xs flex-1 overflow-y-auto"><div class="h-8 px-space-sm rounded-lg flex items-center justify-between bg-bg-hover text-text-primary border-l-2 border-border-focus"><span class="font-body-sm-medium text-body-sm text-text-primary truncate">Main Intake</span><span class="font-label-mono-xs text-label-mono-xs text-text-secondary">12</span></div><div class="h-8 px-space-sm rounded-lg flex items-center justify-between text-text-secondary hover:bg-bg-hover hover:text-text-primary"><span class="font-body-sm text-body-sm truncate">Rapid Triage</span><span class="font-label-mono-xs text-label-mono-xs text-text-muted">4</span></div><div class="h-8 px-space-sm rounded-lg flex items-center justify-between text-text-secondary hover:bg-bg-hover hover:text-text-primary"><span class="font-body-sm text-body-sm truncate">Express Discharge</span><span class="font-label-mono-xs text-label-mono-xs text-text-muted">0</span></div></div></div><div class="pt-space-sm border-t border-border-hairline"><button class="w-full h-8 flex items-center justify-center gap-space-xs bg-bg-surface border border-border-hairline rounded-lg text-border-focus font-body-sm-medium text-body-sm hover:bg-bg-hover hover:border-border-strong transition-colors" type="button"><span class="material-symbols-outlined text-[16px]">add</span><span>New Queue</span></button></div></aside><div class="pl-[240px]"><main class="relative pt-[52px] min-h-screen bg-bg-surface"><div class="flex flex-col w-full">
<div class="w-full flex-1 flex flex-col justify-center items-center px-space-md py-space-xl min-h-[calc(100vh-52px)] bg-bg-surface" style="view-transition-name: main-workspace; animation: fadeInWorkspace 150ms cubic-bezier(0.16, 1, 0.3, 1);">
<div class="flex flex-col items-center text-center max-w-[400px] w-full mx-auto space-y-space-lg">
<div class="select-none leading-none tabular-nums font-banner-token text-[64px] font-bold text-border-hairline" data-numberflow="0">
        0
      </div>
<div class="flex flex-col items-center space-y-space-xs">
<h1 class="font-headline-lg text-headline-lg text-text-primary tracking-[-0.02em]">
          No queues yet
        </h1>
<p class="font-body-default text-body-default text-text-secondary max-w-[280px] leading-[1.6]">
          Create your first queue to start managing tokens and tracking wait times.
        </p>
</div>
<div class="pt-space-xs">
<button class="inline-flex items-center justify-center h-[36px] px-[20px] rounded-lg bg-border-focus text-on-primary font-body-sm-medium text-body-sm font-semibold hover:bg-accent-primary-hover active:bg-accent-primary-active focus:outline-none focus:ring-2 focus:ring-border-focus focus:ring-offset-2 transition-colors duration-120" id="btn-create-first-queue" type="button">
<span class="material-symbols-outlined text-[16px] mr-1.5 -ml-0.5">add</span>
<span>Create your first queue</span>
</button>
</div>
</div>
</div>
<div class="hidden fixed inset-0 z-50 flex items-center justify-center p-space-md bg-text-primary/40" id="modal-new-queue">
<div class="bg-bg-surface w-full max-w-[400px] rounded-lg p-space-lg flex flex-col space-y-space-md" style="box-shadow: 0 1px 0 #E4E3DD, 0 8px 24px rgba(0, 0, 0, 0.08);">
<div class="flex items-center justify-between pb-space-xs">
<span class="font-headline-md text-headline-md text-text-primary">New Queue Station</span>
<button class="w-7 h-7 flex items-center justify-center text-text-muted hover:text-text-primary rounded-lg hover:bg-bg-hover" id="btn-close-modal" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<div class="flex flex-col space-y-space-sm">
<label class="font-label-xs text-label-xs uppercase tracking-wider text-text-secondary" for="queue-name-input">Queue Identifier</label>
<input class="h-[36px] px-space-sm bg-bg-input rounded-lg font-body-default text-body-default text-text-primary placeholder:text-text-muted focus:outline-none focus:bg-bg-surface" id="queue-name-input" placeholder="e.g., Triage Alpha or Fast Track" type="text"/>
</div>
<div class="flex items-center justify-end space-x-space-xs pt-space-xs">
<button class="h-[32px] px-space-md rounded-lg font-body-sm text-body-sm text-text-secondary hover:bg-bg-hover" id="btn-cancel-modal" type="button">
          Cancel
        </button>
<button class="h-[32px] px-space-md bg-border-focus hover:bg-accent-primary-hover text-on-primary font-body-sm-medium text-body-sm rounded-lg transition-colors" id="btn-submit-queue" type="button">
          Initialize
        </button>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const sidebarContainer = document.querySelector('aside .flex.flex-col.space-y-space-xs');
    const sidebarCount = document.querySelector('aside .font-label-mono-xs');

    if (sidebarCount) {
      sidebarCount.textContent = '0 ACTIVE';
    }

    if (sidebarContainer) {
      sidebarContainer.innerHTML = `
        <div class="h-20 w-full rounded-lg flex items-center justify-center p-space-sm bg-bg-canvas/50">
          <span class="font-label-mono-xs text-label-mono-xs text-text-muted">READY TO INITIALIZE</span>
        </div>
      `;
    }

    const openBtn = document.getElementById('btn-create-first-queue');
    const modal = document.getElementById('modal-new-queue');
    const closeBtn = document.getElementById('btn-close-modal');
    const cancelBtn = document.getElementById('btn-cancel-modal');
    const input = document.getElementById('queue-name-input');
    const submitBtn = document.getElementById('btn-submit-queue');

    function openModal() {
      if (modal) {
        modal.classList.remove('hidden');
        if (input) input.focus();
      }
    }

    function closeModal() {
      if (modal) {
        modal.classList.add('hidden');
        if (input) input.value = '';
      }
    }

    if (openBtn) openBtn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (cancelBtn) cancelBtn.addEventListener('click', closeModal);

    const asideAddBtn = document.querySelector('aside button');
    if (asideAddBtn) asideAddBtn.addEventListener('click', openModal);

    if (submitBtn && input) {
      submitBtn.addEventListener('click', function() {
        const val = input.value.trim();
        if (val && sidebarContainer) {
          sidebarContainer.innerHTML = `
            <div class="h-8 px-space-sm rounded-lg flex items-center justify-between bg-bg-hover text-text-primary">
              <span class="font-body-sm-medium text-body-sm text-text-primary truncate">${val}</span>
              <span class="font-label-mono-xs text-label-mono-xs text-text-secondary">0</span>
            </div>
          `;
          if (sidebarCount) sidebarCount.textContent = '1 ACTIVE';
          closeModal();
        }
      });
    }

    if (modal) {
      modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
      });
    }
  })();
</script>
<style>
  @keyframes fadeInWorkspace {
    from {
      opacity: 0;
      transform: translateY(2px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style></main></div></body></html>
